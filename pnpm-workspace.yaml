packages:
  - packages/*

overrides:
  '@rollup/plugin-terser>serialize-javascript': 7.1.4
  # GHSA-g3hv-75wg-m249: remove when typescript-estree accepts minimatch 11.
  '@typescript-eslint/typescript-estree>minimatch': 11.0.8
  esbuild: 0.28.2
  'node-notifier>uuid': 14.0.3
  # vue-tsc still needs the TS 6 API; the bridge runs the TS 7 checker behind it.
  typescript: npm:typescript-native-bridge@6.0.3-bridge.19.tsgo.7.0.2
  'web-ext-run>tmp': 0.2.7
  vite: 8.3.6

allowBuilds:
  esbuild: true
  lefthook: true
  playwright: true
  spawn-sync: true
