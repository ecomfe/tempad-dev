name: publish-plugins

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @tempad-dev/plugins
    runs-on: ubuntu-latest
    concurrency:
      group: publish-plugins
      cancel-in-progress: true

    steps:
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/main ]; then
            echo '::error::Publish must be dispatched from main.'
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @tempad-dev/plugins...

      - name: Validate package
        run: |
          pnpm --filter @tempad-dev/plugins typecheck
          pnpm --filter @tempad-dev/plugins test:coverage

      - name: Publish
        working-directory: packages/plugins
        run: npm publish --access public
