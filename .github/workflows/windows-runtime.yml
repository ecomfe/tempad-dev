name: Windows runtime

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        node: ['22.x', '24.x']
        suite: [contracts, prototype, switch, updates]
    env:
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      TEMPAD_RUNTIME_EVIDENCE_DIR: ${{ github.workspace }}/runtime-ci-logs/fixtures
    steps:
      - name: Preserve reviewed source bytes
        run: git config --global core.autocrlf false

      - name: Share dependency metadata across install and offline packaging
        run: '"pnpm_config_cache_dir=$env:RUNNER_TEMP/tempad-pnpm-cache" >> $env:GITHUB_ENV'

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare dependency metadata for offline release packaging
        if: matrix.suite == 'updates'
        run: pnpm mcp:prepare-release-dependencies

      - name: Record runtime environment
        env:
          EXPECTED_NODE: ${{ matrix.node }}
        run: |
          New-Item -ItemType Directory runtime-ci-logs | Out-Null
          node -p 'JSON.stringify({platform:process.platform,arch:process.arch,node:process.version,execPath:process.execPath})' | Tee-Object runtime-ci-logs/environment.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --version | Tee-Object -Append runtime-ci-logs/environment.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtimePlatform = pnpm exec node -p process.platform
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $runtimeVersion = pnpm exec node -p process.versions.node
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "pnpm runtime: $runtimePlatform $runtimeVersion" | Tee-Object -Append runtime-ci-logs/environment.log
          if ($runtimePlatform -ne 'win32' -or $runtimeVersion.Split('.')[0] -ne $env:EXPECTED_NODE.Split('.')[0]) {
            throw 'Unexpected test runtime'
          }
          $metadataCache = pnpm config get cache-dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "pnpm metadata cache: $metadataCache" | Tee-Object -Append runtime-ci-logs/environment.log
          $metadataFiles = @(Get-ChildItem -LiteralPath $metadataCache -Recurse -File -Filter '*.jsonl' | Where-Object { $_.DirectoryName -match '[\\/]metadata-full[\\/]' })
          "Full metadata files: $($metadataFiles.Count)" | Tee-Object -Append runtime-ci-logs/environment.log
          $metadataFiles | Where-Object { $_.Name -in @('body-parser.jsonl', 'es-object-atoms.jsonl') } | ForEach-Object { $_.FullName } | Tee-Object -Append runtime-ci-logs/environment.log

      - name: Build runtime packages
        run: |
          pnpm --filter @tempad-dev/shared build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm build:mcp

      - name: Test runtime contracts and platform boundaries
        if: matrix.suite == 'contracts'
        shell: cmd
        run: |
          call pnpm --filter @tempad-dev/mcp exec vitest run --config vitest.config.ts tests/runtime- --maxWorkers=2 --testTimeout=30000 --hookTimeout=30000 > runtime-ci-logs\unit.log 2>&1
          set "test_exit=%errorlevel%"
          type runtime-ci-logs\unit.log
          exit /b %test_exit%

      - name: Check supervisor recovery and concurrent edges
        if: matrix.suite == 'prototype'
        shell: cmd
        run: |
          call pnpm mcp:check-runtime-prototype > runtime-ci-logs\prototype.log 2>&1
          set "test_exit=%errorlevel%"
          type runtime-ci-logs\prototype.log
          exit /b %test_exit%

      - name: Check switching, in-flight requests, crashes and rollback
        if: matrix.suite == 'switch'
        shell: cmd
        run: |
          call pnpm mcp:check-runtime-switch > runtime-ci-logs\switch.log 2>&1
          set "test_exit=%errorlevel%"
          type runtime-ci-logs\switch.log
          exit /b %test_exit%

      - name: Check verified downloads and automatic activation
        if: matrix.suite == 'updates'
        shell: cmd
        run: |
          call pnpm mcp:check-runtime-updates > runtime-ci-logs\updates.log 2>&1
          set "test_exit=%errorlevel%"
          type runtime-ci-logs\updates.log
          exit /b %test_exit%

      - name: Preserve runtime evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-runtime-node-${{ matrix.node }}-${{ matrix.suite }}
          path: runtime-ci-logs
          retention-days: 14
          if-no-files-found: warn
