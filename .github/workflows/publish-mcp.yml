name: publish-mcp

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - alpha

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish @tempad-dev/mcp
    runs-on: ubuntu-latest
    concurrency:
      group: publish-mcp
      cancel-in-progress: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @tempad-dev/mcp...

      - name: Build package
        run: pnpm build:mcp

      - name: Publish
        working-directory: packages/mcp-server
        run: npm publish --access public --tag "${{ inputs.tag }}"

      - name: Verify published version
        working-directory: packages/mcp-server
        env:
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          for attempt in {1..20}; do
            published=$(npm view "@tempad-dev/mcp@$version" version --prefer-online 2>/dev/null || true)
            tagged=$(npm view "@tempad-dev/mcp@$NPM_DIST_TAG" version --prefer-online 2>/dev/null || true)
            if [[ "$published" == "$version" && "$tagged" == "$version" ]]; then
              echo "Verified @tempad-dev/mcp@$version on $NPM_DIST_TAG"
              exit 0
            fi
            echo "Waiting for npm to process @tempad-dev/mcp@$version (attempt $attempt/20)"
            sleep 15
          done
          echo "Published version or dist-tag did not become available" >&2
          exit 1
