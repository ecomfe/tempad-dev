name: publish-mcp

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm dist-tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next
          - alpha

permissions:
  contents: read

jobs:
  guard:
    name: Validate release branch
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          if [ "$RELEASE_REF" != refs/heads/main ]; then
            echo '::error::Publish must be dispatched from main.'
            exit 1
          fi

  publish:
    name: Publish @tempad-dev/mcp
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: publish-mcp
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: https://registry.npmjs.org
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --filter @tempad-dev/mcp...

      - name: Build package
        run: pnpm build:mcp

      - name: Validate package
        run: |
          pnpm --filter @tempad-dev/mcp... typecheck
          pnpm --filter @tempad-dev/mcp... test:run
          pnpm mcp:check-bridge
          pnpm --filter @tempad-dev/mcp check:logging
          pnpm mcp:check-runtime-updates
          pnpm mcp:check-runtime-switch

      - name: Prepare and verify the immutable release
        run: pnpm mcp:prepare-release --output "$RUNNER_TEMP/tempad-mcp.tgz" --verify-baseline

      - name: Check the exact release archive
        run: |
          release_check_dir=$(mktemp -d "$RUNNER_TEMP/tempad-mcp-installed.XXXXXX")
          trap 'rm -rf "$release_check_dir"' EXIT
          tar -xzf "$RUNNER_TEMP/tempad-mcp.tgz" -C "$release_check_dir" --strip-components=1
          node packages/mcp-server/scripts/check-bridge-compatibility.mjs "$release_check_dir"
          node packages/mcp-server/scripts/check-log-transport.mjs "$release_check_dir"

      - name: Archive the reviewed release and manifest
        uses: actions/upload-artifact@v7
        with:
          name: tempad-mcp-release
          path: |
            ${{ runner.temp }}/tempad-mcp.tgz
            ${{ runner.temp }}/tempad-mcp.tgz.json

      - name: Publish
        run: npm publish "$RUNNER_TEMP/tempad-mcp.tgz" --ignore-scripts --access public --tag "${{ inputs.tag }}"

      - name: Verify published version
        working-directory: packages/mcp-server
        env:
          NPM_DIST_TAG: ${{ inputs.tag }}
        run: |
          version=$(node -p "require('./package.json').version")
          expected=$(node -p "require(process.env.RUNNER_TEMP + '/tempad-mcp.tgz.json').integrity")
          for attempt in {1..20}; do
            published=$(npm view "@tempad-dev/mcp@$version" version --prefer-online 2>/dev/null || true)
            tagged=$(npm view "@tempad-dev/mcp@$NPM_DIST_TAG" version --prefer-online 2>/dev/null || true)
            integrity=$(npm view "@tempad-dev/mcp@$version" dist.integrity --prefer-online 2>/dev/null || true)
            if [[ "$published" == "$version" && "$tagged" == "$version" && "$integrity" == "$expected" ]]; then
              echo "Verified @tempad-dev/mcp@$version on $NPM_DIST_TAG"
              exit 0
            fi
            echo "Waiting for npm to process @tempad-dev/mcp@$version (attempt $attempt/20)"
            sleep 15
          done
          echo "Published version or dist-tag did not become available" >&2
          exit 1
