name: build

on:
  push:
    branches: [main, 'ci/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.code == 'true' }}
      runtime: ${{ github.event_name == 'workflow_dispatch' || steps.filter.outputs.runtime == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        if: github.event_name != 'workflow_dispatch'
        with:
          base: ${{ github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/heads/ci/') && 'main' || github.ref) || '' }}
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/AGENTS.md'
              - '!TESTING.md'
            runtime:
              - '**'
              - '!docs/**'
              - '!**/AGENTS.md'
              - '!TESTING.md'
              - '!packages/extension/**'
              - '!packages/plugins/**'
              - '!packages/site/**'

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Check agent plugin version
        env:
          PLUGIN_VERSION_BASE: ${{ github.event_name == 'pull_request' && 'HEAD^1' || (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/ci/')) && 'origin/main' || github.event.before }}
        run: node scripts/check-agent-plugin-version.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check agent plugins
        run: >-
          pnpm agent-plugin:build &&
          test -z "$(git status --porcelain --untracked-files=all --
          agent-plugin
          .plugin/marketplace.json
          .agents/plugins/marketplace.json
          .claude-plugin/marketplace.json)"

      - name: Check plugin installer compatibility
        run: pnpm agent-plugin:check-installer

      - name: Type check
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

  build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install browser runtime
        run: pnpm --filter @tempad-dev/extension test:setup

      - name: Build project
        run: pnpm build

      - name: Test the built project
        if: matrix.node == '22.x'
        run: |
          pnpm -r --filter '!@tempad-dev/extension' --if-present test:run
          pnpm --filter @tempad-dev/extension test:built

      # Coverage executes every Node test; only browser and bundle checks remain.
      - name: Test with coverage
        if: matrix.node == '24.x'
        run: pnpm test:coverage

      - name: Test browsers and built extension
        if: matrix.node == '24.x'
        run: |
          pnpm -r --if-present test:browser
          pnpm --filter @tempad-dev/extension check:worker-sandbox
          pnpm --filter @tempad-dev/extension check:built-runtime

      - name: Preserve failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: validation-failures-node-${{ matrix.node }}
          path: |
            packages/*/.vitest/attachments/**
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  typescript-compatibility:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Check sources and declarations with official TypeScript
        # Install outside the workspace; dlx caches may contain an earlier overridden compiler.
        working-directory: ${{ runner.temp }}
        run: |
          tools=$(mktemp -d)
          trap 'rm -rf "$tools"' EXIT
          pnpm --dir "$tools" --ignore-workspace add --ignore-scripts typescript@6.0.3 vue-tsc@3.3.12
          node -e 'const p = require(process.argv[1]); if (p.name !== "typescript" || p.version !== "6.0.3") throw new Error("Expected official TypeScript 6.0.3")' "$tools/node_modules/typescript/package.json"
          tsc="$tools/node_modules/typescript/bin/tsc"
          vue_tsc="$tools/node_modules/vue-tsc/bin/vue-tsc.js"
          node "$tsc" -p "$GITHUB_WORKSPACE/tsconfig.configs.json"
          for package in shared plugins mcp-server; do
            node "$tsc" -p "$GITHUB_WORKSPACE/packages/$package/tsconfig.json" --noEmit
          done
          node "$vue_tsc" -p "$GITHUB_WORKSPACE/packages/extension/tsconfig.json" --noEmit
          node "$vue_tsc" --build "$GITHUB_WORKSPACE/packages/site/tsconfig.json"
          node "$GITHUB_WORKSPACE/scripts/check-declarations.mjs" "$tsc"

  runtime:
    needs: changes
    if: needs.changes.outputs.runtime == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    uses: ./.github/workflows/runtime.yml
    with:
      os: ${{ matrix.os }}

  # A stable required check also succeeds when unrelated jobs are skipped.
  ci:
    if: always()
    needs: [changes, quality, build, typescript-compatibility, runtime]
    runs-on: ubuntu-latest
    steps:
      - name: Require all selected checks to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: |
          node -e 'const results = JSON.parse(process.env.RESULTS); if (results.some(result => !["success", "skipped"].includes(result))) process.exit(1)'
